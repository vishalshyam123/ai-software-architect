services:
  # ----------------------------------------------------
  # PostgreSQL Relational Database
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ai_architect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_architect}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - architect_net

  # ----------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_architect_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI Software Architect
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80","http://127.0.0.1:3000"]
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_architect}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - architect_net

  # ----------------------------------------------------
  # React Frontend (Nginx Reverse Proxy)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_architect_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - architect_net

networks:
  architect_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
